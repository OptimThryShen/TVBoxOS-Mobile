          tr -d ' \t' < patch2.b64 | base64 -d | gunzip > stage2.patch
          echo "第二阶段补丁大小: $(wc -c < stage2.patch) 字节"
          git apply --whitespace=nowarn -v stage2.patch \
            || patch -p1 --no-backup-if-mismatch -i stage2.patch
          rm -f patch2.b64 stage2.patch
          # 那个 DLNA 库所有版本都从 JitPack 下架了，投屏已改成自研 UPnP 实现，这里去掉依赖
          sed -i "/DLNA-Cast:dlna-dmc/d" app/build.gradle
          echo "剩余失效库引用："
          grep -rn "com.android.cast\|fourthline" --include=*.java --include=*.xml app/src/main || echo "无"

      - name: 应用第三阶段补丁（网盘源下载 + 批量移动）
        run: |
          PATCH_B64=.github/patches/stage3.patch.gz.b64
          if [ ! -f "$PATCH_B64" ]; then
            echo "找不到 $PATCH_B64"
            exit 1
          fi
          tr -d ' \t\n\r' < "$PATCH_B64" | base64 -d | gunzip > stage3.patch
          echo "第三阶段补丁大小: $(wc -c < stage3.patch) 字节"
          git apply --whitespace=nowarn -v stage3.patch \
            || patch -p1 --no-backup-if-mismatch -i stage3.patch
          rm -f stage3.patch
          echo "新增文件检查："
          ls -l app/src/main/java/com/github/tvbox/osc/download/LocalProxyResolver.java

      - name: 编译 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 收集 APK
        id: collect
        run: |
          mkdir -p apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk/ \;
          ls -lh apk/
          echo "tag=build-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: 上传 APK 到 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBox-APK
          path: apk/*.apk
          if-no-files-found: error

      - name: 发布到 Releases
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.collect.outputs.tag }}" apk/*.apk \
            --title "MBox 内置下载版 ${{ steps.collect.outputs.tag }}" \
            --notes "GitHub Actions 自动编译，含内置 m3u8 下载功能。手机浏览器直接点下面的 apk 文件即可安装。"
