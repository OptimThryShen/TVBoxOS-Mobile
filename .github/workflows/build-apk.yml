      - name: 去掉不可达的依赖仓库
        if: ${{ inputs.strip_dead_repo }}
        run: |
          python3 - <<'PYEOF'
          import re
          path = 'build.gradle'
          text = open(path, encoding='utf-8').read()
          pattern = r"\n\s*//[^\n]*\n\s*maven \{\s*\n\s*url 'http://4thline\.org/m2'\s*\n\s*allowInsecureProtocol true\s*\n\s*\}"
          new = re.sub(pattern, "", text)
          if new == text:
              pattern = r"\n\s*maven \{\s*\n\s*url 'http://4thline\.org/m2'\s*\n\s*allowInsecureProtocol true\s*\n\s*\}"
              new = re.sub(pattern, "", text)
          open(path, 'w', encoding='utf-8').write(new)
          print('已移除 4thline 仓库' if new != text else '没找到 4thline 仓库，跳过')
          PYEOF

