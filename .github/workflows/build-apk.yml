      - name: 停用已失效的投屏依赖
        run: |
          # 上游 DLNA 投屏库 (dlna-dmc / cling) 已从 JitPack 和 4thline 下架，无法解析。
          # 这里停用投屏功能，但保留 CastListDialog / CastVideo 的类型签名，
          # 所以 DetailActivity / LiveActivity 一行都不用改。
          sed -i "/DLNA-Cast:dlna-dmc/d" app/build.gradle
          sed -i "/com.android.cast.dlna.dmc.DLNACastService/d" app/src/main/AndroidManifest.xml
          rm -f app/src/main/java/com/github/tvbox/osc/ui/adapter/CastDevicesAdapter.java

          cat > app/src/main/java/com/github/tvbox/osc/bean/CastVideo.java <<'JAVAEOF'
          package com.github.tvbox.osc.bean;

          /**
           * 原本实现 com.android.cast.dlna.core.ICast，该库已不可用，这里退化成普通数据类。
           */
          public class CastVideo {

              private final String name;
              private final String url;

              public CastVideo(String name, String url) {
                  this.name = name;
                  this.url = url;
              }

              public String getUri() {
                  return url;
              }

              public String getName() {
                  return name;
              }
          }
          JAVAEOF

          cat > app/src/main/java/com/github/tvbox/osc/ui/dialog/CastListDialog.java <<'JAVAEOF'
          package com.github.tvbox.osc.ui.dialog;

          import android.content.Context;

          import androidx.annotation.NonNull;

          import com.blankj.utilcode.util.ToastUtils;
          import com.github.tvbox.osc.R;
          import com.github.tvbox.osc.bean.CastVideo;
          import com.lxj.xpopup.core.CenterPopupView;

          /**
           * DLNA 投屏依赖已从 JitPack 下架，保留类型签名让调用方继续编译，功能本身停用。
           */
          public class CastListDialog extends CenterPopupView {

              public CastListDialog(@NonNull Context context, CastVideo castVideo) {
                  super(context);
              }

              @Override
              protected int getImplLayoutId() {
                  return R.layout.dialog_cast;
              }

              @Override
              protected void onCreate() {
                  super.onCreate();
                  ToastUtils.showLong("投屏依赖库已失效，本版本暂不支持投屏");
                  findViewById(R.id.btn_cancel).setOnClickListener(v -> dismiss());
                  findViewById(R.id.btn_confirm).setOnClickListener(v -> dismiss());
              }
          }
          JAVAEOF
          echo "投屏功能已停用，剩余引用："
          grep -rn "com.android.cast" --include=*.java --include=*.xml app/src/main || echo "无"

      - name: 编译 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 收集 APK
        id: collect
        run: |
          mkdir -p apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk/ \;
          ls -lh apk/
          echo "tag=build-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: 上传 APK 到 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBox-APK
          path: apk/*.apk
          if-no-files-found: error

      - name: 发布到 Releases
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.collect.outputs.tag }}" apk/*.apk \
            --title "MBox 内置下载版 ${{ steps.collect.outputs.tag }}" \
            --notes "GitHub Actions 自动编译，含内置 m3u8 下载功能。手机浏览器直接点下面的 apk 文件即可安装。"
