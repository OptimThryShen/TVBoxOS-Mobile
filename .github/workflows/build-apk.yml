name: 编译 MBox APK（含内置下载功能）

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 顺便发一个 Release（手机浏览器能直接点开装，推荐勾上）
        type: boolean
        default: true
      strip_dead_repo:
        description: 去掉 4thline.org 依赖仓库（只有构建卡住或报这个域名的错时才勾）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager "platform-tools" "platforms;android-33" "build-tools;32.0.0" "build-tools;33.0.2"

      - name: 准备 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: 释放并应用下载功能补丁
